<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fortress Fence Designer</title>
<!-- FD-VERSION:20260918-000000 -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
  :root{--bark:#2b2019;--rust:#b5622f;--navy:#12294d;--blue:#2f6fd0;--sand:#f5efe4;
        --card:#fffdf8;--line:#d9cbb3;--ink:#1c2330;--gray:#4a5261;--green:#5a6b3b;--gold:#c2893f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--sand);}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  header{background:var(--bark);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;flex:none;}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em;}
  header .ver{font-size:10px;color:#a89a80;margin-left:auto;}
  .searchbar{display:flex;gap:6px;padding:8px;background:var(--navy);flex:none;}
  .searchbar input{flex:1;padding:10px;border:0;border-radius:6px;font-size:16px;outline:none;}
  .searchbar button{padding:10px 14px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;}
  #map{flex:1;min-height:200px;position:relative;}
  .toolbar{display:flex;gap:6px;padding:8px;background:var(--card);border-top:1px solid var(--line);flex-wrap:wrap;flex:none;}
  .tool{flex:1 1 auto;min-width:70px;padding:9px 6px;border:1.5px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;font-weight:600;color:var(--gray);text-align:center;cursor:pointer;}
  .tool.active{background:var(--rust);color:#fff;border-color:var(--rust);}
  .tool.draw.active{background:var(--blue);border-color:var(--blue);}
  .panel{background:var(--card);border-top:1px solid var(--line);padding:10px 12px;flex:none;max-height:38vh;overflow-y:auto;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .row:last-child{border-bottom:0;}
  .big{font-size:26px;font-weight:800;color:var(--navy);}
  .muted{color:var(--gray);font-size:12px;}
  .est-line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  select,.mini-input{font-size:15px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .btn{padding:10px 14px;border:0;border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn.primary{background:var(--green);color:#fff;}
  .btn.gold{background:var(--gold);color:#2b2019;}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--gray);}
  .chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:2px;}
  .obstacle-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);}
  .hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(18,41,77,.92);color:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;z-index:5;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .mapboxgl-ctrl-logo{opacity:.6;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bark);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .seg{display:flex;gap:4px;margin:6px 0;}
  .seg button{flex:1;padding:7px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:var(--gray);}
  .seg button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .nokey{padding:24px;text-align:center;color:var(--gray);font-size:14px;line-height:1.6;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏰 Fortress Fence Designer</h1>
    <span class="ver" id="ver">v000000</span>
  </header>
  <div class="searchbar">
    <input id="addr" type="text" placeholder="Search an address…" autocomplete="off">
    <button onclick="searchAddr()">Go</button>
  </div>
  <div id="map"><div class="hint" id="hint">Search an address to begin</div></div>
  <div class="toolbar" id="toolbar">
    <div class="tool draw" id="tool-draw" onclick="setMode('draw')">✏️ Draw Fence</div>
    <div class="tool" id="tool-obst" onclick="setMode('obstacle')">📍 Add Obstacle</div>
    <div class="tool" id="tool-undo" onclick="undoPoint()">↩ Undo</div>
    <div class="tool" id="tool-clear" onclick="clearAll()">🗑 Clear</div>
  </div>
  <div class="panel" id="panel">
    <div class="row">
      <div><div class="muted">Total fence line</div><div class="big"><span id="footage">0</span> <span style="font-size:15px;">ft</span></div></div>
      <div style="text-align:right;">
        <div class="muted">Tier</div>
        <select id="tier" onchange="recalc()">
          <option value="pine">Pine — $23/ft</option>
          <option value="cedar" selected>Japanese Cedar — $27/ft</option>
          <option value="wrc">Western Red Cedar — $35/ft</option>
        </select>
      </div>
    </div>
    <div id="est-breakdown" style="margin:6px 0;"></div>
    <div id="obstacle-list"></div>
    <div class="row" style="border-top:2px solid var(--navy);border-bottom:0;padding-top:8px;margin-top:6px;">
      <div style="font-weight:700;">Estimated total</div>
      <div class="big" style="font-size:22px;">$<span id="total">0</span></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn ghost" style="flex:1;" onclick="showPreview()">👁 Style Preview</button>
      <button class="btn primary" style="flex:1;" onclick="saveToJob()">💾 Save to Job</button>
    </div>
    <p class="muted" style="margin:8px 0 0;text-align:center;">Draw the fence line on the aerial view — footage and price update as you go. Prices are starting points; confirm on site.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const MAPBOX_TOKEN='pk.eyJ1IjoiZm9ydHJlc3NmZW5jaW5nMSIsImEiOiJjbXU3aDNodXUwMGEyMnpwdm9yeWs5cHlvIn0.8pNgnmVsoG3ABXLwFKn_FA';
const FF_REST_BASE='https://fortress-fencing-default-rtdb.firebaseio.com/apps/FF-9951B0570E93CD33/fortress_v4';
const VERSION='20260918-000000';

// Tier pricing ($/ft, pickets+posts combined — matches the main app)
const TIERS={
  pine:{label:'Pine',perFt:23,color:'#c2893f'},
  cedar:{label:'Japanese Cedar',perFt:27,color:'#b5622f'},
  wrc:{label:'Western Red Cedar',perFt:35,color:'#5a6b3b'}
};
// Obstacle types with default add-on cost (editable) and icon
const OBSTACLES={
  tree:{label:'Tree',icon:'🌳',cost:0},
  bush:{label:'Bush / shrub',icon:'🌿',cost:0},
  trim:{label:'Tree trimming',icon:'✂️',cost:0},
  rock:{label:'Rock / hard dig',icon:'🪨',cost:0},
  slope:{label:'Slope / grade',icon:'⛰️',cost:0},
  removeold:{label:'Remove old fence',icon:'🚧',cost:0},
  gate:{label:'Gate',icon:'🚪',cost:0},
  other:{label:'Other',icon:'📌',cost:0}
};

document.getElementById('ver').textContent='v'+VERSION.split('-')[1];

let map=null, mode='draw';
let points=[];           // fence line vertices [lng,lat]
let obstacles=[];        // {type,lngLat,cost,note,marker}
let lineFootage=0;

// ── MAP INIT ──
function initMap(center){
  if(!MAPBOX_TOKEN||MAPBOX_TOKEN.indexOf('pk.')!==0){
    document.getElementById('map').innerHTML='<div class="nokey">Map token missing. Add your Mapbox public token to use the aerial view.</div>';
    return;
  }
  mapboxgl.accessToken=MAPBOX_TOKEN;
  map=new mapboxgl.Map({
    container:'map',
    style:'mapbox://styles/mapbox/satellite-streets-v12',
    center:center||[-99.7333,32.4487], // Abilene, TX default
    zoom:center?19:12,
    attributionControl:true
  });
  map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-right');
  map.on('load',()=>{
    map.addSource('fenceline',{type:'geojson',data:emptyLine()});
    map.addLayer({id:'fenceline-line',type:'line',source:'fenceline',
      paint:{'line-color':TIERS[document.getElementById('tier').value].color,'line-width':4}});
    map.addLayer({id:'fenceline-pts',type:'circle',source:'fenceline-pts-src',
      paint:{'circle-radius':5,'circle-color':'#fff','circle-stroke-color':'#12294d','circle-stroke-width':2}},'fenceline-line');
  });
  // add a separate source for points
  map.on('style.load',()=>{ if(!map.getSource('fenceline-pts-src'))map.addSource('fenceline-pts-src',{type:'geojson',data:emptyPts()}); });
  map.on('click',onMapClick);
  updateHint();
}
function emptyLine(){return {type:'Feature',geometry:{type:'LineString',coordinates:[]}};}
function emptyPts(){return {type:'FeatureCollection',features:[]};}

// ── ADDRESS SEARCH ──
async function searchAddr(){
  const q=document.getElementById('addr').value.trim();
  if(!q){toast('Type an address first.');return;}
  try{
    const url='https://api.mapbox.com/geocoding/v5/mapbox.places/'+encodeURIComponent(q)+'.json?access_token='+MAPBOX_TOKEN+'&limit=1&country=us';
    const r=await fetch(url); const d=await r.json();
    if(!d.features||!d.features.length){toast('Address not found.');return;}
    const c=d.features[0].center; // [lng,lat]
    if(!map){initMap(c);} else {map.flyTo({center:c,zoom:19});}
    toast('Loaded — draw the fence line.');
    updateHint();
  }catch(e){toast('Search failed: '+e.message);}
}

// ── DRAW / OBSTACLE MODES ──
function setMode(m){
  mode=m;
  document.getElementById('tool-draw').classList.toggle('active',m==='draw');
  document.getElementById('tool-obst').classList.toggle('active',m==='obstacle');
  updateHint();
}
function updateHint(){
  const h=document.getElementById('hint');
  if(!map){h.style.display='block';h.textContent='Search an address to begin';return;}
  h.style.display='block';
  h.textContent = mode==='draw'
    ? (points.length?'Tap to add the next fence corner':'Tap the map to start the fence line')
    : 'Tap where the obstacle is';
  if(points.length>1&&mode==='draw')h.textContent='Keep tapping corners — footage updating';
}

function onMapClick(e){
  const lngLat=[e.lngLat.lng,e.lngLat.lat];
  if(mode==='draw'){
    points.push(lngLat);
    redrawLine();
  }else{
    addObstacleAt(lngLat);
  }
  updateHint();
}

// ── FENCE LINE ──
function redrawLine(){
  if(map.getSource('fenceline'))map.getSource('fenceline').setData({type:'Feature',geometry:{type:'LineString',coordinates:points}});
  if(map.getSource('fenceline-pts-src'))map.getSource('fenceline-pts-src').setData(
    {type:'FeatureCollection',features:points.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:p}}))});
  lineFootage=computeFootage(points);
  document.getElementById('footage').textContent=Math.round(lineFootage);
  recalc();
}
function undoPoint(){ if(points.length){points.pop();redrawLine();updateHint();} }
function clearAll(){
  if(!confirm('Clear the whole drawing (fence line + obstacles)?'))return;
  points=[]; redrawLine();
  obstacles.forEach(o=>{if(o.marker)o.marker.remove();}); obstacles=[];
  renderObstacles(); recalc();
}
// Haversine distance in feet between two [lng,lat]
function ftBetween(a,b){
  const R=20925524.9; // earth radius in feet
  const dLat=(b[1]-a[1])*Math.PI/180, dLng=(b[0]-a[0])*Math.PI/180;
  const la1=a[1]*Math.PI/180, la2=b[1]*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function computeFootage(pts){
  let t=0; for(let i=1;i<pts.length;i++)t+=ftBetween(pts[i-1],pts[i]); return t;
}

// ── OBSTACLES ──
function addObstacleAt(lngLat){
  const type=prompt('Obstacle type — enter one:\ntree, bush, trim, rock, slope, removeold, gate, other','tree');
  if(!type)return;
  const key=(type||'').toLowerCase().trim();
  const def=OBSTACLES[key]||OBSTACLES.other;
  const note=prompt('Note (optional):','')||'';
  const costStr=prompt('Added cost for this (leave blank for $0):','');
  const cost=parseFloat(costStr)||0;
  const el=document.createElement('div');
  el.style.cssText='font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));cursor:pointer;';
  el.textContent=def.icon;
  const marker=new mapboxgl.Marker({element:el}).setLngLat(lngLat).addTo(map);
  const ob={type:key,label:def.label,icon:def.icon,lngLat,cost,note,marker};
  el.onclick=(ev)=>{ev.stopPropagation();editObstacle(ob);};
  obstacles.push(ob);
  renderObstacles(); recalc();
  setMode('draw'); // back to drawing after placing one
}
function editObstacle(ob){
  const c=prompt('Edit added cost for "'+ob.label+'" (or type DELETE):', ob.cost||'');
  if(c===null)return;
  if(c.trim().toUpperCase()==='DELETE'){ if(ob.marker)ob.marker.remove(); obstacles=obstacles.filter(x=>x!==ob); renderObstacles(); recalc(); return; }
  ob.cost=parseFloat(c)||0; renderObstacles(); recalc();
}
function renderObstacles(){
  const el=document.getElementById('obstacle-list');
  if(!obstacles.length){el.innerHTML='';return;}
  el.innerHTML='<div class="muted" style="margin:6px 0 2px;">Obstacles & extras</div>'+
    obstacles.map((o,i)=>`<div class="obstacle-item">
      <span>${o.icon} ${o.label}${o.note?' — '+esc(o.note):''}</span>
      <span style="font-weight:700;color:var(--green);">${o.cost>0?'+$'+o.cost.toFixed(0):'—'}</span>
    </div>`).join('');
}

// ── ESTIMATE ──
function recalc(){
  const tier=TIERS[document.getElementById('tier').value];
  if(map&&map.getLayer&&map.getLayer('fenceline-line'))map.setPaintProperty('fenceline-line','line-color',tier.color);
  const ft=Math.round(lineFootage);
  const fenceCost=ft*tier.perFt;
  const obTotal=obstacles.reduce((s,o)=>s+(o.cost||0),0);
  const total=fenceCost+obTotal;
  document.getElementById('est-breakdown').innerHTML=
    `<div class="est-line"><span>${ft} ft × $${tier.perFt}/ft (${tier.label})</span><span>$${fmt(fenceCost)}</span></div>`+
    (obTotal>0?`<div class="est-line"><span>Obstacles & extras</span><span>$${fmt(obTotal)}</span></div>`:'');
  document.getElementById('total').textContent=fmt(total);
}

// ── STYLE PREVIEW (illustration, not a photo of their house) ──
function showPreview(){
  const tier=TIERS[document.getElementById('tier').value];
  const w=window.open('','_blank');
  const svg=fenceSVG(tier);
  w.document.write(`<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>${tier.label} preview</title>
    <style>body{margin:0;font-family:-apple-system,sans-serif;background:#f5efe4;text-align:center;padding:20px;}
    h2{color:#2b2019;}p{color:#4a5261;}</style></head><body>
    <h2>${tier.label} — style preview</h2>
    <p>6&#39; privacy fence &mdash; illustration of the style, not your actual yard.</p>
    ${svg}
    <p style="font-size:12px;color:#7a828f;margin-top:16px;">Fortress Fencing Partners &bull; 325-864-4623</p>
    </body></html>`);
  w.document.close();
}
function fenceSVG(tier){
  const c=tier.color, dark=shade(c,-25), light=shade(c,18);
  let pickets='';
  for(let i=0;i<22;i++){ const x=20+i*26; pickets+=`<rect x="${x}" y="40" width="22" height="230" rx="3" fill="${i%2?light:c}" stroke="${dark}" stroke-width="1"/><path d="M${x},40 L${x+11},26 L${x+22},40 Z" fill="${i%2?light:c}" stroke="${dark}"/>`; }
  return `<svg viewBox="0 0 600 300" style="width:100%;max-width:600px;height:auto;background:linear-gradient(#bcd6e8,#e8f0f5);border-radius:8px;">
    <rect x="0" y="270" width="600" height="30" fill="#7a8b52"/>
    ${pickets}
    <rect x="10" y="95" width="580" height="16" fill="${dark}" opacity=".85"/>
    <rect x="10" y="210" width="580" height="16" fill="${dark}" opacity=".85"/>
  </svg>`;
}
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)+pct, g=((n>>8)&255)+pct, b=(n&255)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// ── SAVE TO JOB (writes a design record to Firebase) ──
async function saveToJob(){
  if(!points.length){toast('Draw a fence line first.');return;}
  const client=prompt('Save this design under a customer/job name:','');
  if(!client)return;
  const tierKey=document.getElementById('tier').value;
  const design={
    id:'fd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    client, tier:tierKey,
    footage:Math.round(lineFootage),
    points, // the drawn line
    obstacles:obstacles.map(o=>({type:o.type,label:o.label,cost:o.cost,note:o.note,lngLat:o.lngLat})),
    total:parseFloat(document.getElementById('total').textContent.replace(/,/g,''))||0,
    savedAt:new Date().toISOString()
  };
  try{
    const r=await fetch(FF_REST_BASE+'/fenceDesigns/'+design.id+'.json',{
      method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(design)});
    if(!r.ok)throw new Error('server '+r.status);
    toast('✓ Design saved for '+client+'.');
  }catch(e){ toast('Save failed: '+e.message); }
}

// ── UTIL ──
function fmt(n){return (Math.round(n)).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}

// Enter key on address
document.getElementById('addr').addEventListener('keydown',e=>{if(e.key==='Enter')searchAddr();});
// Start with draw mode active
setMode('draw');
</script>
</body>
</html>
